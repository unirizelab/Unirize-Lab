<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>

    <!-- Main U Gradient -->
    <linearGradient id="uGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Outer U Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Container -->
  <rect width="500" height="500" rx="60" fill="#070B14"/>
  <circle cx="250" cy="200" r="160" fill="url(#bgGlow)"/>
  <circle cx="250" cy="200" r="130" fill="#0D1527" stroke="#1E293B" stroke-width="3"/>
  
  <!-- Outer Soft Light Ring -->
  <circle cx="250" cy="200" r="100" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.25"/>

  <!-- Glowing U Mark -->
  <g filter="url(#glow)">
    <path d="M190 120 V230 A60 60 0 0 0 310 230 V120" 
          fill="none" 
          stroke="url(#uGradient)" 
          stroke-width="34" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Top Terminal Bulbs -->
    <circle cx="190" cy="120" r="12" fill="#00E5FF" />
    <circle cx="310" cy="120" r="12" fill="#00E5FF" />
  </g>
  
  <!-- Interior Horizontal Accent Lines -->
  <g opacity="0.65">
    <line x1="235" y1="190" x2="265" y2="190" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
    <line x1="230" y1="205" x2="270" y2="205" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
    <line x1="240" y1="220" x2="260" y2="220" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="250" y="380" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="'Space Grotesk', 'Inter', sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="6">UNIRIZE LABS</text>
</svg>
